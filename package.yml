package: community.lazycat.app.musicgrabber
version: 4.6.1
name: MusicGrabber
description: "Self-hosted music acquisition service: search YouTube, SoundCloud, Soulseek and lossless sources, grab a single track or full album, auto-tag and drop into your Navidrome/Jellyfin library. Watched playlists and artists keep the library current; multi-user support included."
min_os_version: 1.5.0
homepage: https://gitlab.com/g33kphr33k/musicgrabber
author: g33kphr33k
license: Unlicense
permissions:
  required:
    - net.internet
